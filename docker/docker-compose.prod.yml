version: '3.8'

services:
  # ============== Infrastructure ==============
  redis:
    image: redis:7-alpine
    container_name: sd-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sd-network

  localstack:
    image: localstack/localstack:latest
    container_name: sd-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sd-network

  # ============== Application ==============
  api:
    image: ${DOCKER_REGISTRY}/social-dashboard-api:${IMAGE_TAG:-latest}
    container_name: sd-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      # Redis (container networking)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # S3 / LocalStack (container networking)
      S3_ENDPOINT: http://localstack:4566
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-social-dashboard-uploads}
      S3_REGION: ${AWS_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - "127.0.0.1:${API_PORT:-3172}:3000"
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - sd-network

  web:
    image: ${DOCKER_REGISTRY}/social-dashboard-web:${IMAGE_TAG:-latest}
    container_name: sd-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      - api
    networks:
      - sd-network

volumes:
  redis_data:
  localstack_data:

networks:
  sd-network:
    driver: bridge
